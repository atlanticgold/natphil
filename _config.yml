title: Natural Philosophy
tagline: The study of things as they are.
description: >-
  Natural Philosophy is a journal of essays in the older sense of the term:
  philosophy as the patient study of things as they are.

# --- Deployment settings ---
# Set to match how this site is actually hosted:
#
# Project site (repo is a normal repo, e.g. "natural-philosophy", served at
# https://<username>.github.io/natural-philosophy/) — the default here:
#   url:     "https://<your-username>.github.io"
#   baseurl: "/natural-philosophy"
#
# User/org site (repo is named <username>.github.io, served at the root):
#   url:     "https://<your-username>.github.io"
#   baseurl: ""
#
# Every internal link and asset path in this project is generated with
# Jekyll's relative_url filter (or the <base> tag in _layouts/default.html
# for images referenced from essay Markdown), so baseurl is the only thing
# that needs to change between these two setups for a LOCAL build
# (bundle exec jekyll serve/build).
#
# The actual GitHub Pages deployment doesn't depend on getting this right:
# .github/workflows/pages.yml asks actions/configure-pages for the correct
# base path and passes it to `jekyll build --baseurl` directly, which
# overrides whatever is set here. So the value below only needs to be
# accurate for local testing to match how the live site will behave.
url: "https://your-username.github.io"
baseurl: "/natural-philosophy"

markdown: kramdown

# Clean essay URLs, e.g. /essays/2026/09/11/on-first-principles/
permalink: /essays/:year/:month/:day/:title/

# Lets essays write math as $$ ... $$ (kramdown tells $$ apart from text
# by context: on its own line = displayed, inline in a sentence = inline).
# This alone doesn't render anything — see the MathJax script in
# _layouts/default.html, loaded only on essay pages.
kramdown:
  math_engine: mathjax

# Keep project files out of the built site.
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
